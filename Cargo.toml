[workspace]
members = [
    "crates/plugin-system",
    "crates/plugin-macros",
    "crates/sd-types",
    "crates/sd-events",
    "crates/sd-actions",
    "crates/sd-profiles",
    "crates/sd-devices",
    "crates/sd-paths",
    "crates/sd-api",
    "crates/sd-plugins",
    "crates/sd-core",
    "crates/plugin-cli",
    "crates/plugin-system/tests/cabi-fixture",
    "plugins/plugin-timer",
    "plugins/plugin-system-monitor",
    "plugins/plugin-key-simulator",
    "plugins/plugin-volume-master",
    "plugins/plugin-obs",
]
exclude = [
    # Built for wasm32-wasip2, never for the host: its wit-bindgen glue emits
    # wasm-only imports that cannot link into a native cdylib. Build it with
    # `sd-plugins build --wasm`, or `cargo build` from inside its directory.
    "plugins/plugin-timer-wasm",
    "plugins/plugin-misbehaving-wasm",
    "target",
    "data",
    "web",
    "docs",
    "scripts",
    "releases",
]
resolver = "2"
