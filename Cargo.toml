[workspace]
members = [
    "crates/plugin-system",
    "crates/sd-types",
    "crates/sd-events",
    "crates/sd-actions",
    "crates/sd-profiles",
    "crates/sd-devices",
    "crates/sd-paths",
    "crates/sd-api",
    "crates/sd-plugins",
    "crates/sd-core",
    "crates/plugin-cli",
]
exclude = [
    # Every plugin is a WASI component now, built for wasm32-wasip2 and never
    # for the host: the wit-bindgen glue emits wasm-only imports that cannot
    # link into a host binary. Build them with `sd-plugins build`, or
    # `cargo build` from inside the plugin's directory.
    "plugins/plugin-timer-wasm",
    "plugins/plugin-misbehaving-wasm",
    "target",
    "data",
    "web",
    "docs",
    "scripts",
    "releases",
]
resolver = "2"
