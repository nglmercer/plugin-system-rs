[package]
name = "plugin-system-monitor-wasm"
version = "0.1.0"
edition = "2021"
description = "System resource monitoring, as a WASI Preview 2 component"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The guest deliberately does not depend on `plugin-system`: that crate is the
# host, and none of it exists inside a component. The WIT contract is the only
# thing shared.
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
