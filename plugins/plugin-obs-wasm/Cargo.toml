[package]
name = "plugin-obs-wasm"
version = "0.1.0"
edition = "2021"
description = "OBS Studio control over obs-websocket 5.x, as a WASI Preview 2 component"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The obs-websocket 5.x handshake is a SHA256/base64 challenge. Both are pure
# Rust and compile to wasm32-wasip2 without a host dependency, which is what
# lets the protocol stay guest-side.
sha2 = "0.10"
base64 = "0.22"
