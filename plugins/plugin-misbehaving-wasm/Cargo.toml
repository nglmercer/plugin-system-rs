[package]
name = "plugin-misbehaving-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test fixture: a component that hangs, panics, and allocates on demand"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.46"

# Not a shippable plugin: it exists to misbehave on demand so the host's
# containment guarantees can be tested. The build CLI skips it so it never
# lands in `plugins/` alongside the real ones.
[package.metadata.sd-plugins]
fixture = true
