[package]
name = "plugin-system"
version = "0.1.0"
edition = "2021"

[features]
default = []
url-loader = ["ureq", "ureq/_tls", "dirs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
log = "0.4"
ureq = { version = "3", optional = true, default-features = false }
dirs = { version = "6", optional = true }
semver = "1"
wasmtime = { version = "47", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
wasmtime-wasi = "47"

[dev-dependencies]
tempfile = "3"
