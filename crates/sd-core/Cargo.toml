[package]
name = "sd-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sd-core"
path = "src/main.rs"

[features]
default = []
# Load WebAssembly component plugins in addition to native ones.
wasm = ["sd-plugins/wasm"]

[dependencies]
sd-types = { path = "../sd-types" }
sd-events = { path = "../sd-events" }
sd-actions = { path = "../sd-actions" }
sd-profiles = { path = "../sd-profiles" }
sd-devices = { path = "../sd-devices" }
sd-api = { path = "../sd-api" }
sd-plugins = { path = "../sd-plugins" }
sd-paths = { path = "../sd-paths" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
muda = { version = "0.19", default-features = false, features = ["gtk"] }
tao = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
local-ip-address = "0.6"
ctrlc = "3"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading"] }
